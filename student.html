function prevLiveQuestion(){if(state.ui.liveIndex>0){state.ui.liveIndex--;renderStudent()}}
async function finishLiveExam(){const qs=getLiveExamQuestions(state.ui.liveExamId);let score=0;qs.forEach((q,i)=>{if(state.ui.liveAnswers[i]===q.correctIndex)score++});state.ui.liveScore=score;state.ui.liveSubmitted=true;stopTimer();if(score/qs.length>=0.6)confetti();const exam=state.exams.find(e=>e.id===state.ui.liveExamId);if(exam){const sub={id:'sub_'+Date.now(),examId:state.ui.liveExamId,examTitle:exam.title,studentName:'Student',answer:`Score: ${score}/${qs.length}`,submittedAt:Date.now()};await putAll('submissions',[sub]);state.submissions=await getAll('submissions')}renderStudent()}
function exitLiveExam(){state.ui.screen='live';state.ui.liveExamId=null;state.ui.liveSubmitted=false;stopTimer();renderStudent()}
function retakeLiveExam(){state.ui.liveIndex=0;state.ui.liveAnswers=new Array(getLiveExamQuestions(state.ui.liveExamId).length).fill(-1);state.ui.liveSubmitted=false;state.ui.liveScore=0;startTimer();renderStudent()}
async function submitBroad(examId,examTitle){const b=document.getElementById('broad_'+examId);const a=b?.value.trim();if(!a)return toast('আগে উত্তর লিখুন','error');await putAll('submissions',[{id:'sub_'+Date.now(),examId,examTitle,studentName:'Student',answer:a,submittedAt:Date.now()}]);await hydrate();toast('✅ উত্তর সংরক্ষিত','success')}

/* ========== RENDER ========== */
function renderAll(){renderStudent()}
function renderStudent(){const s=state;if(s.ui.loading)return;const el=document.getElementById('screen');let html='';switch(s.ui.screen){case 'welcome':html=renderWelcome(s);break;case 'exams':html=renderExams(s);break;case 'hub':html=renderHub(s);break;case 'contentType':html=renderContentType(s);break;case 'live':html=renderLive(s);break;case 'liveTake':html=renderLiveTake(s);break;case 'jobs':html=renderJobs(s);break;case 'progress':html=renderProgress(s);break;case 'search':html=renderSearch(s);break;case 'settings':html=renderSettings(s);break}el.innerHTML=html;if((s.ui.screen==='welcome'||s.ui.screen==='search')&&s.ui.searchQuery){const inp=document.getElementById('searchInput');if(inp){inp.value=s.ui.searchQuery;inp.focus()}}}

function renderWelcome(s){
  const lastExam=s.examTypes.find(e=>e.id===s.ui.lastExamId)||s.examTypes[0];
  const lastExamSubjects=lastExam?getSubjectsForExam(lastExam.id):[];
  const lastExamMcqCount=lastExam?s.mcqs.filter(m=>m.examId===lastExam.id).length:0;
  const recent=s.submissions.slice(-3).reverse();
  const completed=isChallengeCompleted(),challengeStreak=getChallengeStreak(),totalContent=s.contents.length;
  const challenge=getTodaysChallenge();
  const activeJobs=s.jobNotifications.filter(j=>{const d=daysUntilDeadline(j.deadline);return !j.deadline||d===null||d>=0});
  return `<div class="premium-greeting"><div class="welcome-back">Welcome Back</div><div class="welcome-sub"><span>👋 ${getGreeting()}, শিক্ষার্থী</span>${s.ui.streak>0?`<span class="streak-chip">🔥 ${s.ui.streak} দিন</span>`:''}</div><div class="welcome-quote">"${getQuote()}"</div></div>
  <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="searchInput" class="search-input" type="text" placeholder="প্রশ্ন, বিষয় বা পরীক্ষা খুঁজুন..." value="${esc(s.ui.searchQuery||'')}" oninput="updateSearch(this.value)" /></div>
  <div class="dual-cards">${lastExam?`<div class="mini-hero" style="background:${lastExam.grad}" onclick="openHub('${lastExam.id}')"><div class="mini-label">🔥 CONTINUE</div><div class="mini-icon">${lastExam.icon}</div><div class="mini-title">${esc(lastExam.title)}</div><div class="mini-meta">${lastExamMcqCount} MCQ • ${lastExamSubjects.length} বিষয়</div><div class="mini-cta">পড়ুন →</div></div>`:''}<div class="mini-hero" style="background:${completed?'linear-gradient(135deg,#10b981,#059669)':'linear-gradient(135deg,#f59e0b,#ec4899)'}" onclick="openDailyChallengeModal()"><div class="mini-label">${completed?'✅ DONE':'🎯 CHALLENGE'}</div><div class="mini-icon">${completed?'✅':'🎯'}</div><div class="mini-title">${completed?'সম্পন্ন!':'আজকের'}</div><div class="mini-meta">${completed?`🔥 ${challengeStreak} দিন`:`+${challenge?.bonus||50} পয়েন্ট`}</div><div class="mini-cta">${completed?'দেখুন':'শুরু →'}</div></div></div>
  <div class="stats-grid" style="margin-top:16px"><div class="stat-box" style="--accent:var(--brand)"><div class="stat-icon">🎯</div><div class="stat-value">${s.mcqs.length}</div><div class="stat-label">MCQ</div></div><div class="stat-box" style="--accent:#10b981"><div class="stat-icon">📝</div><div class="stat-value">${s.exams.length}</div><div class="stat-label">Live</div></div><div class="stat-box" style="--accent:#f59e0b"><div class="stat-icon">📚</div><div class="stat-value">${totalContent}</div><div class="stat-label">কনটেন্ট</div></div><div class="stat-box" style="--accent:#ec4899"><div class="stat-icon">💼</div><div class="stat-value">${activeJobs.length}</div><div class="stat-label">Jobs</div></div></div>
  <div class="sec-head-compact"><h3>⚡ কুইক অ্যাকশন</h3></div>
  <div class="grid-3"><button onclick="goScreen('progress')" class="quick-action" style="--accent-color:rgba(251,191,36,.12)"><div style="font-size:24px">🏆</div><div style="font-size:10px;font-weight:800;margin-top:4px;position:relative">লিডারবোর্ড</div></button><button onclick="goScreen('jobs')" class="quick-action" style="--accent-color:rgba(var(--brand-rgb),.12);position:relative"><div style="font-size:24px">💼</div><div style="font-size:10px;font-weight:800;margin-top:4px;position:relative">Jobs</div>${activeJobs.length>0?`<div style="position:absolute;top:8px;right:8px;background:var(--brand);color:white;font-size:9px;font-weight:900;padding:1px 5px;border-radius:8px">${activeJobs.length}</div>`:''}</button><button onclick="shareApp()" class="quick-action" style="--accent-color:rgba(37,211,102,.12)"><div style="font-size:24px">📤</div><div style="font-size:10px;font-weight:800;margin-top:4px;position:relative">শেয়ার</div></button></div>
  ${activeJobs.length>0?`<div class="sec-head-compact"><h3>💼 নতুন চাকরি</h3><button class="action" onclick="goScreen('jobs')">সব →</button></div>${activeJobs.slice(0,2).map(job=>renderJobCard(job)).join('')}`:''}
  ${lastExamSubjects.length?`<div class="sec-head-compact"><h3>📖 বিষয়সমূহ</h3><button class="action" onclick="openHub('${lastExam.id}')">সব →</button></div><div class="chips">${lastExamSubjects.map(sub=>{const cC=getExamContents(lastExam.id,sub.name).length,mC=getExamMcqs(lastExam.id,sub.name).length;return`<button class="chip" onclick="openHub('${lastExam.id}');selectSubject('${sub.name.replace(/'/g,"\\'")}')"><span>${sub.icon}</span>${esc(sub.name)}${(cC+mC)>0?`<span style="font-size:9px;opacity:.7">(${mC+cC})</span>`:''}</button>`}).join('')}</div>`:''}
  <div class="sec-head-compact"><h3>⭐ জনপ্রিয় পরীক্ষা</h3><button class="action" onclick="goScreen('exams')">সব →</button></div>
  <div class="grid-2">${s.examTypes.slice(0,4).map(ex=>`<div class="exam-card-centered" style="--grad:${ex.grad}" onclick="openHub('${ex.id}')"><div class="exam-tag">${esc(ex.tag)}</div><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%"><div class="exam-icon">${ex.icon}</div><div class="exam-title">${esc(ex.title)}</div><div class="exam-desc">${esc(ex.desc||'')}</div></div><div class="exam-footer">→ শুরু করুন</div></div>`).join('')}</div>
  ${recent.length>0?`<div class="sec-head-compact"><h3>📊 সাম্প্রতিক কাজ</h3></div>${recent.map((r,i)=>`<div class="activity" style="animation-delay:${i*40}ms"><div class="activity-icon" style="background:rgba(16,185,129,.15);color:#10b981">✍️</div><div class="activity-body"><div class="activity-title">${esc(r.examTitle||'ব্রড উত্তর')}</div><div class="activity-meta">${new Date(r.submittedAt||Date.now()).toLocaleDateString('bn-BD')} • জমা দেওয়া</div></div></div>`).join('')}`:''}`;
}

function renderExams(s){if(!s.examTypes.length)return`<div class="empty-state"><div class="emoji">📚</div><div class="title">শীঘ্রই নতুন পরীক্ষা আসবে</div><div class="sub">Admin থেকে সিঙ্ক হলে এখানে দেখাবে</div></div>`;return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><h2>Exam Dashboard</h2><p class="muted">${s.examTypes.length}টি পরীক্ষা</p></div><button onclick="shareApp()" style="padding:8px 12px;border-radius:99px;border:none;background:#25D366;color:white;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit">📤 Share</button></div><div class="grid-2">${s.examTypes.map(ex=>{const subs=getSubjectsForExam(ex.id);return`<div class="exam-card-centered" style="--grad:${ex.grad}" onclick="openHub('${ex.id}')"><div class="exam-tag">${esc(ex.tag)}</div><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%"><div class="exam-icon">${ex.icon}</div><div class="exam-title">${esc(ex.title)}</div><div class="exam-desc">${esc(ex.desc||'')}</div><div style="font-size:9px;opacity:.8;margin-top:6px">${subs.length}টি বিষয়</div></div><div class="exam-footer">→ শুরু করুন</div></div>`}).join('')}</div>`}

function renderHub(s){
  const exam=s.examTypes.find(e=>e.id===s.ui.examId)||s.examTypes[0];if(!exam)return`<div class="empty-state"><div class="emoji">📚</div><div class="title">কোনো পরীক্ষা নেই</div></div>`;
  const examSubjects=getSubjectsForExam(exam.id);
  const examMcqs=getExamMcqs(exam.id,s.ui.subject);
  const examContents=getExamContents(exam.id,s.ui.subject);
  const q=examMcqs.length?examMcqs[s.ui.quizIndex%examMcqs.length]:null;
  const fs=s.ui.fontSize;const isB=q&&s.bookmarks.find(b=>b.id===q.id);
  const qIdx=examMcqs.length?(s.ui.quizIndex%examMcqs.length)+1:0;const totalQ=examMcqs.length;
  const pct=totalQ?Math.round(qIdx/totalQ*100):0;
  const subStats={};examSubjects.forEach(sub=>{subStats[sub.name]={mcq:getExamMcqs(exam.id,sub.name).length,content:getExamContents(exam.id,sub.name).length}});
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><button class="btn btn-sm btn-ghost" onclick="goScreen('exams')">← Back</button><div style="text-align:center;flex:1"><div style="font-weight:800;font-size:15px">${esc(exam.title)}</div><div class="muted" style="font-size:10px">${esc(s.ui.subject)} • ${totalQ} MCQ</div></div><div style="display:flex;gap:4px"><button class="btn btn-sm btn-ghost" onclick="fontSizeChange(-1)">A-</button><button class="btn btn-sm btn-ghost" onclick="fontSizeChange(1)">A+</button></div></div>
  ${examSubjects.length?`<div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:10px">বিষয়সমূহ (${examSubjects.length})</h3><div class="grid-2">${examSubjects.map(sub=>{const active=s.ui.subject===sub.name,st=subStats[sub.name];return`<button onclick="selectSubject('${sub.name.replace(/'/g,"\\'")}')" class="subj-card ${active?'active':''}"><div class="subj-icon">${sub.icon}</div><div class="subj-name">${esc(sub.name)}</div>${st.mcq>0?`<div class="subj-badge-sm">${st.mcq} MCQ</div>`:`<div class="subj-meta">${st.content>0?st.content+' কনটেন্ট':'খালি'}</div>`}</button>`}).join('')}</div></div>`:''}
  <div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0;color:var(--brand)">🎯 MCQ প্র্যাকটিস</h3><div style="display:flex;gap:6px;align-items:center">${state.ui.quizStartTime?`<span class="timer-badge" id="quizTimer">${formatDuration(Date.now()-state.ui.quizStartTime)}</span>`:''}<span style="font-size:11px;padding:5px 11px;border-radius:99px;background:rgba(16,185,129,.15);color:var(--success);font-weight:800">Score: ${s.ui.quizScore}</span></div></div>
  ${q?`<div class="progress-track" style="margin-bottom:12px"><div class="progress-fill" style="width:${pct}%"></div></div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px"><p style="font-weight:700;line-height:1.4;font-size:${fs}px;flex:1"><span style="color:var(--brand);font-weight:900">${qIdx}.</span> ${esc(q.question)}</p><div style="display:flex;gap:2px"><button class="bookmark-btn" onclick="toggleBookmark('${q.id}')">${isB?'⭐':'☆'}</button><button class="bookmark-btn" onclick="shareQuestion(${JSON.stringify(q).replace(/"/g,'&quot;')}, '${esc(exam.title).replace(/'/g,"\\'")}')" style="font-size:18px">📤</button></div></div>${q.options.map((opt,i)=>{let cls='';if(s.ui.selectedOpt!==null){if(i===q.correctIndex)cls='correct';else if(i===s.ui.selectedOpt)cls='wrong'}return`<button class="option ${cls}" onclick="selectMcq(${i},${q.correctIndex})"><span style="font-weight:900;margin-right:6px;opacity:.7">${String.fromCharCode(65+i)}.</span>${esc(opt)}</button>`}).join('')}${s.ui.selectedOpt!==null?`<div style="padding:12px;border-radius:12px;background:rgba(var(--brand-rgb),.1);color:var(--brand);font-size:12px;font-weight:600;margin-top:8px">💡 ${esc(q.explanation)}</div><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="nextMcq()">পরবর্তী প্রশ্ন (${qIdx}/${totalQ}) →</button>`:''}`:`<div style="text-align:center;padding:24px 10px;opacity:.7"><div style="font-size:32px;margin-bottom:6px">🎯</div><div style="font-weight:800;font-size:13px">এই বিষয়ে এখনো প্রশ্ন আসেনি</div><div class="muted" style="font-size:11px;margin-top:4px">Admin থেকে সিঙ্ক হলে আসবে</div></div>`}</div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">📚 কনটেন্ট</h3><span class="muted" style="font-size:10px">${examContents.length}টি</span></div><div class="content-grid">${CONTENT_TYPES.map(({key,label,icon,color})=>{const items=filterByType(examContents,key);return`<div class="content-card" onclick="openContentType('${key}')" style="border-top:3px solid ${color}">${items.length>0?`<div class="badge">${items.length}</div>`:''}<div class="icon">${icon}</div><div class="name">${label}</div><div class="count">${items.length}টি</div></div>`}).join('')}</div></div>`;
}

function renderContentType(s){const exam=s.examTypes.find(e=>e.id===s.ui.examId)||s.examTypes[0];if(!exam)return'';const typeInfo=CONTENT_TYPES.find(t=>t.key===s.ui.contentType)||{icon:'📄',label:s.ui.contentType,color:'#6366f1'};const allContents=getExamContents(exam.id,s.ui.subject);const items=filterByType(allContents,s.ui.contentType);const fs=s.ui.fontSize;return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><button class="btn btn-sm btn-ghost" onclick="backFromContentType()">← Back</button><div style="text-align:center;flex:1"><div style="font-weight:800;font-size:15px">${typeInfo.icon} ${typeInfo.label}</div><div class="muted" style="font-size:10px">${esc(exam.title)} • ${esc(s.ui.subject)}</div></div><div style="display:flex;gap:4px"><button class="btn btn-sm btn-ghost" onclick="fontSizeChange(-1)">A-</button><button class="btn btn-sm btn-ghost" onclick="fontSizeChange(1)">A+</button></div></div><div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,${typeInfo.color},${typeInfo.color}dd);color:white;border:none"><div style="display:flex;align-items:center;gap:14px"><div style="font-size:42px">${typeInfo.icon}</div><div><div style="font-size:12px;opacity:.9;font-weight:600">মোট কনটেন্ট</div><div style="font-size:28px;font-weight:900;margin-top:2px">${items.length}</div><div style="font-size:11px;opacity:.85">${esc(s.ui.subject)}-এর ${typeInfo.label}</div></div></div></div>${items.length?items.map(it=>`<div style="margin-bottom:12px;padding:14px;border-radius:12px;background:rgba(148,163,184,.06);border:1px solid var(--border)"><div style="font-weight:800;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px"><span>${typeInfo.icon}</span><span style="flex:1">${esc(it.title)}</span></div><div style="font-size:${fs}px;white-space:pre-line;opacity:.88;line-height:1.55">${esc(it.body)}</div>${s.ui.contentType==='PDF'&&(it.body||'').startsWith('http')?`<a href="${it.body}" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;padding:9px 16px;border-radius:10px;background:var(--brand);color:white;font-size:12px;font-weight:800;text-decoration:none">📄 PDF খুলুন</a>`:''}</div>`).join(''):`<div class="empty-state" style="padding:48px 20px"><div class="emoji">${typeInfo.icon}</div><div class="title">এই বিষয়ে ${typeInfo.label.toLowerCase()} শীঘ্রই আসবে</div><div class="sub">Admin থেকে সিঙ্ক হলে দেখাবে</div></div>`}`}

function renderLive(s){if(!s.exams.length)return`<h2>লাইভ পরীক্ষা</h2><p class="muted" style="margin-bottom:14px">MCQ ও ব্রড টাইপ</p><div class="empty-state"><div class="emoji">📝</div><div class="title">শীঘ্রই নতুন পরীক্ষা আসবে</div><div class="sub">Admin থেকে সিঙ্ক হলে আসবে</div></div>`;return `<h2>লাইভ পরীক্ষা</h2><p class="muted" style="margin-bottom:14px">MCQ ও ব্রড টাইপ</p>${s.exams.map(ex=>{const qCount=getLiveExamQuestions(ex.id).length;return `<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:8px"><span style="padding:5px 11px;border-radius:99px;background:${ex.type==='MCQ'?'rgba(var(--brand-rgb),.15)':'rgba(245,158,11,.15)'};color:${ex.type==='MCQ'?'var(--brand)':'#b45309'}">${ex.type==='MCQ'?'🎯 MCQ':'✍️ ব্রড'}</span><span style="color:var(--danger)">⏳ ${ex.daysDuration}দি • ${ex.durationMinutes}মি</span></div><h3 style="margin-bottom:6px">${esc(ex.title)}</h3><p class="muted" style="margin-bottom:10px">${esc(ex.instructions||'')}</p>${ex.type==='BROAD'?`<textarea id="broad_${ex.id}" placeholder="এখানে আপনার উত্তর লিখুন..." style="margin-bottom:8px"></textarea><button class="btn btn-success" style="width:100%" onclick="submitBroad('${ex.id}','${esc(ex.title).replace(/'/g,"\\'")}')">✓ উত্তর জমা দিন</button>`:`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:8px 12px;border-radius:10px;background:rgba(var(--brand-rgb),.08)"><span style="font-size:12px;font-weight:700">📊 মোট প্রশ্ন: <strong style="color:var(--brand)">${qCount}</strong></span><span style="font-size:11px;color:var(--muted)">${qCount>0?'প্রস্তুত ✅':'প্রশ্ন নেই ⚠️'}</span></div><button class="btn btn-primary" style="width:100%" onclick="startLiveExam('${ex.id}')" ${qCount===0?'disabled style="opacity:.5"':''}>পরীক্ষা শুরু করুন →</button>`}</div>`}).join('')}`}

function renderLiveTake(s){const exam=s.exams.find(e=>e.id===s.ui.liveExamId);if(!exam)return'<div class="empty-state"><div class="title">পরীক্ষা পাওয়া যায়নি</div></div>';const qs=getLiveExamQuestions(s.ui.liveExamId);if(!qs.length)return'<div class="empty-state"><div class="title">কোনো প্রশ্ন নেই</div></div>';const curIdx=s.ui.liveIndex,q=qs[curIdx],isLast=curIdx===qs.length-1,selected=s.ui.liveAnswers[curIdx];if(s.ui.liveSubmitted){const score=s.ui.liveScore,total=qs.length,pctScore=Math.round(score/total*100);const emoji=pctScore>=80?'🏆':pctScore>=60?'🎉':pctScore>=40?'💪':'📖';return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><button class="btn btn-sm btn-ghost" onclick="exitLiveExam()">← Back</button><div style="text-align:center;flex:1"><div style="font-weight:800;font-size:15px">ফলাফল</div><div class="muted" style="font-size:10px">${esc(exam.title)}</div></div><div style="width:60px"></div></div><div class="hero" style="text-align:center;padding:32px 24px"><div class="hero-content"><div style="font-size:64px;margin-bottom:8px">${emoji}</div><div style="font-size:14px;opacity:.9;font-weight:600">আপনার স্কোর</div><div style="font-size:48px;font-weight:900;margin-top:4px;letter-spacing:-1px">${score}/${total}</div><div style="font-size:16px;opacity:.92;margin-top:4px;font-weight:700">${pctScore}%</div></div></div><div style="margin-top:16px;display:flex;gap:10px"><button class="btn btn-ghost" style="flex:1" onclick="exitLiveExam()">ফিরে যান</button><button class="btn btn-primary" style="flex:1" onclick="retakeLiveExam()">আবার দিন</button></div><div class="card" style="margin-top:16px"><h3>📋 উত্তরপত্র</h3>${qs.map((q,i)=>{const ans=s.ui.liveAnswers[i],correct=ans===q.correctIndex;return`<div style="padding:10px;border-radius:10px;background:rgba(148,163,184,.08);margin-top:8px;border-left:3px solid ${correct?'#10b981':'#ef4444'}"><div style="font-size:11px;font-weight:800;color:${correct?'var(--success)':'var(--danger)'}">${correct?'✓':'✗'} প্রশ্ন ${i+1}</div><div style="font-size:11px;margin-top:4px;line-height:1.4">${esc(q.question)}</div><div style="font-size:10px;color:var(--muted);margin-top:4px">সঠিক: ${String.fromCharCode(65+q.correctIndex)}. ${esc(q.options[q.correctIndex])}</div></div>`}).join('')}</div>`}return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><button class="btn btn-sm btn-ghost" onclick="if(confirm('পরীক্ষা ছেড়ে যাবেন?')) exitLiveExam()">← বেরিয়ে যান</button><div style="text-align:center;flex:1"><div style="font-weight:800;font-size:14px">${esc(exam.title)}</div><div class="muted" style="font-size:10px">প্রশ্ন ${curIdx+1}/${qs.length}</div></div><span class="timer-badge" id="quizTimer">${formatDuration(Date.now()-(s.ui.quizStartTime||Date.now()))}</span></div><div class="card" style="margin-bottom:14px"><div class="progress-track" style="margin-bottom:14px"><div class="progress-fill" style="width:${Math.round((curIdx+1)/qs.length*100)}%"></div></div><div style="font-size:11px;color:var(--brand);font-weight:800;margin-bottom:6px">প্রশ্ন ${curIdx+1} / ${qs.length}</div><p style="font-weight:700;line-height:1.5;font-size:${s.ui.fontSize}px;margin-bottom:14px">${esc(q.question)}</p>${q.options.map((opt,i)=>{let cls='option';if(selected===i)cls+=' selected';return`<button class="${cls}" onclick="selectLiveAnswer(${i})"><span style="font-weight:900;margin-right:6px;opacity:.7">${String.fromCharCode(65+i)}.</span>${esc(opt)}</button>`}).join('')}</div><div style="display:flex;gap:10px"><button class="btn btn-ghost" style="flex:1" onclick="prevLiveQuestion()" ${curIdx===0?'disabled style="opacity:.4;flex:1"':''}>← আগের</button>${isLast?`<button class="btn btn-success" style="flex:1" onclick="if(confirm('পরীক্ষা জমা দেবেন?')) finishLiveExam()">✓ সাবমিট</button>`:`<button class="btn btn-primary" style="flex:1" onclick="nextLiveQuestion()">পরের →</button>`}</div><div class="card" style="margin-top:14px;padding:12px"><div class="muted" style="font-size:10px;font-weight:700;margin-bottom:8px">প্রশ্ন নেভিগেশন</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px">${qs.map((_,i)=>{const answered=s.ui.liveAnswers[i]!==-1,isCur=i===curIdx;return`<button onclick="state.ui.liveIndex=${i};renderStudent()" style="padding:8px;border-radius:8px;border:2px solid ${isCur?'var(--brand)':answered?'var(--success)':'var(--border)'};background:${isCur?'var(--brand)':answered?'rgba(16,185,129,.15)':'var(--card)'};color:${isCur?'white':answered?'var(--success)':'var(--text)'};font-weight:800;font-size:11px;cursor:pointer;font-family:inherit">${i+1}</button>`}).join('')}</div></div>`}

function renderJobs(s){const jobs=s.jobNotifications;const active=jobs.filter(j=>{const d=daysUntilDeadline(j.deadline);return !j.deadline||d===null||d>=0});const expired=jobs.filter(j=>{const d=daysUntilDeadline(j.deadline);return j.deadline&&d!==null&&d<0});return `<div style="text-align:center;margin-bottom:20px"><div style="font-size:28px;margin-bottom:4px">💼</div><h2 style="margin:0;font-size:22px;font-weight:900">Job Notifications</h2><p class="muted" style="font-size:12px;margin-top:4px">${active.length}টি সক্রিয় বিজ্ঞপ্তি ${expired.length>0?`• ${expired.length}টি শেষ`:''}</p></div>${active.length===0&&expired.length===0?`<div class="empty-state"><div class="emoji">💼</div><div class="title">কোনো চাকরির বিজ্ঞপ্তি নেই</div><div class="sub">Admin থেকে সিঙ্ক হলে দেখাবে</div></div>`:''}${active.length>0?`<div class="sec-head-compact" style="margin-top:0"><h3>🟢 সক্রিয় (${active.length})</h3></div>${active.map(job=>renderJobCard(job)).join('')}`:''}${expired.length>0?`<div class="sec-head-compact"><h3>⚫ শেষ হওয়া (${expired.length})</h3></div>${expired.map(job=>renderJobCard(job)).join('')}`:''}`}

function renderJobCard(job){const days=daysUntilDeadline(job.deadline);const urgent=days!==null&&days<=3&&days>=0;const expired=days!==null&&days<0;const typeIcon=job.type==='pdf'?'📄':job.type==='link'?'🔗':'📝';const typeLabel=job.type==='pdf'?'PDF':job.type==='link'?'লিংক':'টেক্সট';return `<div class="job-card" style="--job-color:${job.color||'var(--brand)'}" onclick="openJobDetail('${job.id}')"><div class="job-header"><div class="job-icon">${typeIcon}</div><div class="job-body"><div class="job-title">${esc(job.title)}</div><div class="job-org">${esc(job.org||'সরকারি চাকরি')}</div></div>${job.deadline?`<div class="job-deadline" style="background:${expired?'rgba(148,163,184,.15)':urgent?'rgba(239,68,68,.15)':'rgba(16,185,129,.15)'};color:${expired?'#64748b':urgent?'#ef4444':'#10b981'}">${expired?'শেষ':days===0?'আজ':`${days}দি`}</div>`:''}</div>${job.desc?`<div class="job-desc">${esc(job.desc)}</div>`:''}<div class="job-footer"><span class="job-type-badge">${typeIcon} ${typeLabel}</span><span>বিস্তারিত →</span></div></div>`}

function openJobDetail(jobId){const job=state.jobNotifications.find(j=>j.id===jobId);if(!job)return;const days=daysUntilDeadline(job.deadline);const expired=days!==null&&days<0;openModal(`<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px"><div class="job-icon" style="background:${job.color||'var(--brand)'}">${job.type==='pdf'?'📄':job.type==='link'?'🔗':'📝'}</div><div style="flex:1;min-width:0"><h3 style="margin:0 0 4px;font-size:16px;line-height:1.3">${esc(job.title)}</h3><p class="muted" style="font-size:12px;font-weight:600">${esc(job.org||'সরকারি চাকরি')}</p></div></div>${job.deadline?`<div style="padding:10px 14px;border-radius:12px;background:${expired?'rgba(148,163,184,.1)':'rgba(239,68,68,.08)'};display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:11px;color:var(--muted);font-weight:800">⏰ শেষ তারিখ</span><span style="font-size:12px;font-weight:900;color:${expired?'var(--muted)':'var(--danger)'}">${new Date(job.deadline).toLocaleDateString('bn-BD')} ${expired?'(শেষ)':`(${days} দিন বাকি)`}</span></div>`:''}${job.desc?`<div style="padding:14px;border-radius:12px;background:rgba(148,163,184,.06);font-size:13px;line-height:1.6;white-space:pre-line">${esc(job.desc)}</div>`:''}${job.url?`<a href="${job.url}" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:14px;padding:14px;border-radius:12px;background:var(--brand);color:white;text-decoration:none;font-weight:800;font-size:13px">${job.type==='pdf'?'📄 PDF দেখুন':'🔗 লিংক খুলুন'}</a>`:''}<button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="closeModal()">বন্ধ</button>`)}

function openDailyChallengeModal(){const c=getTodaysChallenge();if(!c)return toast('কোনো চ্যালেঞ্জ নেই');const completed=isChallengeCompleted(),streak=getChallengeStreak(),q=c.mcq;if(completed){openModal(`<div style="text-align:center"><div style="font-size:48px">✅</div><h3 style="margin-top:10px">আজকের চ্যালেঞ্জ সম্পন্ন!</h3><p class="muted" style="margin-top:6px">আগামীকাল নতুন চ্যালেঞ্জ আসবে</p><div style="margin-top:16px;padding:12px;border-radius:12px;background:rgba(16,185,129,.1)"><div style="font-size:13px;font-weight:800">🔥 স্ট্রিক: ${streak} দিন</div></div><button class="btn btn-ghost" onclick="closeModal()" style="width:100%;margin-top:14px">বন্ধ</button></div>`);return}openModal(`<h3 style="margin:0 0 4px">🎯 আজকের চ্যালেঞ্জ</h3><p class="muted" style="font-size:11px;margin-bottom:12px">সঠিক উত্তরে +${c.bonus} পয়েন্ট • 🔥 ${streak} দিন</p><div style="padding:14px;border-radius:14px;background:rgba(var(--brand-rgb),.08);margin-bottom:12px"><p style="font-weight:800;font-size:14px;line-height:1.4">${esc(q.question)}</p></div>${q.options.map((opt,i)=>{const isC=i===q.correctIndex,isS=state.ui.challengeAnswer===i,show=state.ui.challengeSubmitted;let cls='option';if(show&&isC)cls+=' correct';else if(show&&isS&&!isC)cls+=' wrong';return`<button class="${cls}" onclick="submitChallengeAnswer(${i})" ${show?'disabled':''} style="opacity:${show&&!isC&&!isS?0.5:1}"><span style="font-weight:900;margin-right:6px;opacity:.7">${String.fromCharCode(65+i)}.</span>${esc(opt)}</button>`}).join('')}${state.ui.challengeSubmitted?`<div style="padding:12px;border-radius:12px;background:rgba(var(--brand-rgb),.1);color:var(--brand);font-size:12px;font-weight:600;margin-top:8px">💡 ${esc(q.explanation)}</div><button class="btn btn-primary" onclick="closeModal()" style="width:100%;margin-top:12px">ঠিক আছে</button>`:''}`)}

function renderSearch(s){const q=(s.ui.searchQuery||'').toLowerCase().trim();const mMcq=s.mcqs.filter(m=>(m.question||'').toLowerCase().includes(q)||(m.subject||'').toLowerCase().includes(q)).slice(0,20);const mExam=s.examTypes.filter(e=>(e.title||'').toLowerCase().includes(q)||(e.desc||'').toLowerCase().includes(q)||(e.tag||'').toLowerCase().includes(q));const mJobs=s.jobNotifications.filter(j=>(j.title||'').toLowerCase().includes(q)||(j.org||'').toLowerCase().includes(q)).slice(0,10);const mCont=s.contents.filter(c=>(c.title||'').toLowerCase().includes(q)||(c.body||'').toLowerCase().includes(q)).slice(0,10);const noRes=!mMcq.length&&!mExam.length&&!mCont.length&&!mJobs.length;return `<div class="search-wrap" style="animation:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="searchInput" class="search-input" type="text" placeholder="প্রশ্ন, বিষয় বা পরীক্ষা খুঁজুন..." value="${esc(s.ui.searchQuery||'')}" oninput="updateSearch(this.value)" /></div>${noRes?`<div class="empty-state"><div class="emoji">🔍</div><div class="title">কিছু পাওয়া যায়নি</div><div class="sub">অন্য কিছু দিয়ে চেষ্টা করুন</div></div>`:''}${mExam.length?`<div class="sec-head-compact"><h3>📚 পরীক্ষা (${mExam.length})</h3></div>${mExam.map(ex=>`<div class="activity" onclick="openHub('${ex.id}')" style="cursor:pointer"><div class="activity-icon" style="background:${ex.grad};color:white">${ex.icon}</div><div class="activity-body"><div class="activity-title">${esc(ex.title)}</div><div class="activity-meta">${esc(ex.tag)} • ${esc(ex.desc||'')}</div></div><span style="align-self:center;color:var(--brand);font-weight:900">→</span></div>`).join('')}`:''}${mJobs.length?`<div class="sec-head-compact"><h3>💼 Jobs (${mJobs.length})</h3></div>${mJobs.map(j=>renderJobCard(j)).join('')}`:''}${mMcq.length?`<div class="sec-head-compact"><h3>🎯 MCQ (${mMcq.length})</h3></div>${mMcq.map(m=>`<div class="card" style="margin-bottom:8px;padding:12px"><div style="font-weight:700;font-size:12px;line-height:1.4">${esc(m.question)}</div><div class="muted" style="font-size:10px;margin-top:4px">${esc(m.subject)} • ${esc(s.examTypes.find(e=>e.id===m.examId)?.title||m.examId)}</div></div>`).join('')}`:''}${mCont.length?`<div class="sec-head-compact"><h3>📖 কনটেন্ট (${mCont.length})</h3></div>${mCont.map(c=>{const ti=CONTENT_TYPES.find(t=>t.key===c.type)||{icon:'📄',label:c.type};return`<div class="card" style="margin-bottom:8px;padding:12px"><div style="font-weight:800;font-size:12px;display:flex;gap:6px;align-items:center"><span>${ti.icon}</span><span>${esc(c.title)}</span></div><div class="muted" style="font-size:10px;margin-top:4px">${esc(ti.label)} • ${esc(c.subject)}</div></div>`}).join('')}`:''}`}

function renderProgress(s){const weekly=[45,60,55,80,70,90,75],days=['সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি','রবি'];const avg=Math.round(weekly.reduce((a,b)=>a+b,0)/weekly.length);const bmcq=s.bookmarks.map(b=>s.mcqs.find(m=>m.id===b.id)).filter(Boolean);const lbData=getLeaderboardData(s.ui.leaderboardTab);const myRank=lbData.findIndex(e=>e.isMe)+1;return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0">Progress</h2><button onclick="shareApp()" style="padding:8px 12px;border-radius:99px;border:none;background:#25D366;color:white;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit">📤 Share</button></div><div class="grid-2" style="margin-bottom:14px"><div class="hero" style="padding:16px"><div class="hero-content"><div style="font-size:11px;opacity:.9">বর্তমান র‍্যাঙ্ক</div><div style="font-size:26px;font-weight:800;margin-top:4px">${myRank>0?'#'+myRank:'Top 8%'}</div><div style="font-size:11px;margin-top:4px">গড়: ${avg}%</div></div></div><div class="card"><div class="muted" style="font-size:11px">🔥 ডেইলি স্ট্রিক</div><div style="font-size:28px;font-weight:800;color:var(--success);margin-top:4px">${s.ui.streak}</div><div class="muted" style="font-size:11px;margin-top:4px">${s.submissions.length}টি জমা</div></div></div><div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">🏆 Leaderboard</h3><span class="muted" style="font-size:10px">${lbData.length} জন</span></div><div class="lb-tabs"><button class="lb-tab ${s.ui.leaderboardTab==='all'?'active':''}" onclick="setLeaderboardTab('all')">🌍 সব</button><button class="lb-tab ${s.ui.leaderboardTab==='weekly'?'active':''}" onclick="setLeaderboardTab('weekly')">📅 সপ্তাহ</button><button class="lb-tab ${s.ui.leaderboardTab==='my'?'active':''}" onclick="setLeaderboardTab('my')">👤 আমি</button></div>${lbData.length===0?`<div class="empty-state" style="padding:20px"><div class="emoji" style="font-size:32px">🏆</div><div class="title" style="font-size:13px">এখনো কোনো এন্ট্রি নেই</div><div class="sub">পরীক্ষা দিয়ে নিজের র‍্যাঙ্ক তৈরি করুন!</div></div>`:lbData.slice(0,10).map((e,i)=>{const r=i+1,rc=r===1?'rank-1':r===2?'rank-2':r===3?'rank-3':'rank-default';return`<div class="lb-item ${e.isMe?'me':''}"><div class="lb-rank ${rc}">${r===1?'🥇':r===2?'🥈':r===3?'🥉':r}</div><div class="lb-info"><div class="lb-name">${esc(e.name)} ${e.isMe?'<span style="color:var(--brand);font-size:10px">(আমি)</span>':''}</div><div class="lb-meta">${esc(e.exam||'সব পরীক্ষা')}</div></div><div class="lb-score">${e.score}</div></div>`}).join('')}</div><div class="card" style="margin-bottom:14px"><h3>সাপ্তাহিক প্রোগ্রেস (মিনিট)</h3>${weekly.map((m,i)=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span style="font-weight:700">${days[i]}</span><span style="color:var(--brand);font-weight:800">${m} min</span></div><div class="progress-track"><div class="progress-fill" style="width:${m}%"></div></div></div>`).join('')}</div><div class="card"><h3>⭐ বুকমার্ক করা প্রশ্ন (${bmcq.length})</h3>${bmcq.length?bmcq.slice(0,10).map(m=>`<div style="padding:10px;border-radius:12px;background:rgba(148,163,184,.08);margin-top:8px"><div style="font-weight:700;font-size:12px;line-height:1.4">${esc(m.question)}</div><div class="muted" style="font-size:10px;margin-top:4px">${esc(m.subject)} • ${esc(s.examTypes.find(e=>e.id===m.examId)?.title||m.examId)}</div><button onclick="toggleBookmark('${m.id}')" style="margin-top:6px;padding:4px 10px;border-radius:8px;background:rgba(239,68,68,.1);color:var(--danger);border:none;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit">✕ সরান</button></div>`).join(''):'<p class="muted" style="margin-top:6px;font-size:12px">এখনো কোনো বুকমার্ক নেই।</p>'}</div>`}

function renderSettings(s){const unread=s.notifications.filter(n=>!n.read).length;const totalScore=s.ui.quizScore+s.submissions.length*5;const currentTheme=COLOR_THEMES.find(t=>t.id===s.ui.colorTheme);const lastSync=s.ui.lastSyncAt;return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><button class="btn btn-sm btn-ghost" onclick="goScreen('welcome')">← Back</button><div style="text-align:center;flex:1"><div style="font-weight:800;font-size:16px">⚙️ Settings</div></div><div style="width:60px"></div></div><div class="settings-profile"><div class="settings-profile-avatar">👤</div><div><div class="settings-profile-name">শিক্ষার্থী</div><div class="settings-profile-meta">🔥 ${s.ui.streak} দিন • 🎯 ${totalScore} পয়েন্ট • ⭐ ${s.bookmarks.length} বুকমার্ক</div></div></div>
<div class="settings-section"><div class="settings-section-title">🎨 Appearance</div><div class="settings-card"><button class="settings-row" onclick="openThemePicker()"><div class="settings-row-left"><span class="settings-row-icon">🎨</span><span>Color Theme</span></div><div class="settings-row-right"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:${currentTheme?.grad}"></span>${currentTheme?.name||'Indigo'} →</span></div></button><button class="settings-row" onclick="toggleDarkMode()"><div class="settings-row-left"><span class="settings-row-icon">${s.ui.darkMode?'🌙':'☀️'}</span><span>${s.ui.darkMode?'Dark Mode':'Light Mode'}</span></div><div class="settings-row-right"><div style="width:44px;height:26px;border-radius:99px;background:${s.ui.darkMode?'var(--brand)':'rgba(148,163,184,.3)'};position:relative"><div style="position:absolute;top:3px;left:${s.ui.darkMode?'21px':'3px'};width:20px;height:20px;border-radius:50%;background:white;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div></div></div></button></div></div>
<div class="settings-section"><div class="settings-section-title">🔄 Cloud Sync</div><div class="settings-card"><button class="settings-row" onclick="manualSync()"><div class="settings-row-left"><span class="settings-row-icon">🔄</span><span>Sync Now</span></div><div class="settings-row-right">🔄 →</div></button><div class="settings-row" style="cursor:default"><div class="settings-row-left"><span class="settings-row-icon">☁️</span><span>Last Sync</span></div><div class="settings-row-right">${lastSync?new Date(lastSync).toLocaleString('bn-BD'):'এখনো সিঙ্ক হয়নি'}</div></div></div></div>
<div class="settings-section"><div class="settings-section-title">🔔 Notifications</div><div class="settings-card"><button class="settings-row" onclick="requestNotificationPermission()"><div class="settings-row-left"><span class="settings-row-icon">🔔</span><span>Enable Push</span></div><div class="settings-row-right">${(typeof Notification!=='undefined'&&Notification.permission==='granted')?'✅ চালু':'সেট করুন →'}</div></button><button class="settings-row" onclick="openNotifications()"><div class="settings-row-left"><span class="settings-row-icon">📬</span><span>সব নোটিফিকেশন</span></div><div class="settings-row-right">${unread>0?`<span style="background:var(--danger);color:white;font-size:9px;padding:2px 7px;border-radius:99px;font-weight:900">${unread}</span> →`:'→'}</div></button></div></div>
<div class="settings-section"><div class="settings-section-title">💾 Data & Backup</div><div class="settings-card"><button class="settings-row" onclick="exportMyData()"><div class="settings-row-left"><span class="settings-row-icon">⬇️</span><span>Export Backup</span></div><div class="settings-row-right">→</div></button><button class="settings-row" onclick="clearMyData()" style="color:var(--danger)"><div class="settings-row-left"><span class="settings-row-icon">🗑️</span><span>Clear My Data</span></div><div class="settings-row-right">→</div></button></div></div>
<div class="settings-section"><div class="settings-section-title">📜 Legal & Info</div><div class="settings-card"><button class="settings-row" onclick="openPrivacy()"><div class="settings-row-left"><span class="settings-row-icon">📖</span><span>Privacy Policy</span></div><div class="settings-row-right">→</div></button><button class="settings-row" onclick="openTerms()"><div class="settings-row-left"><span class="settings-row-icon">📄</span><span>Terms of Service</span></div><div class="settings-row-right">→</div></button><button class="settings-row" onclick="openAbout()"><div class="settings-row-left"><span class="settings-row-icon">ℹ️</span><span>About</span></div><div class="settings-row-right">v${APP_VERSION} →</div></button></div></div>
<div class="settings-section"><div class="settings-section-title">💬 Support</div><div class="settings-card"><button class="settings-row" onclick="shareApp()"><div class="settings-row-left"><span class="settings-row-icon">📤</span><span>Share App</span></div><div class="settings-row-right">→</div></button><button class="settings-row" onclick="contactSupport()"><div class="settings-row-left"><span class="settings-row-icon">✉️</span><span>Contact Us</span></div><div class="settings-row-right">→</div></button><button class="settings-row" onclick="rateApp()"><div class="settings-row-left"><span class="settings-row-icon">⭐</span><span>Rate App</span></div><div class="settings-row-right">→</div></button></div></div>
<div class="settings-version"><div style="font-weight:800;color:var(--text);margin-bottom:4px">${APP_NAME}</div><div>Version ${APP_VERSION} • Build ${APP_BUILD}</div><div>Developer: ${DEVELOPER}</div><div style="margin-top:8px">© 2026 All Rights Reserved</div></div>`}

/* ========== INIT ========== */
hydrate().then(()=>{
  // Auto sync on load
  setTimeout(()=>syncFromCloud(false),1500);
});
if('serviceWorker'in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
