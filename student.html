<!DOCTYPE html>
<html lang="bn" data-color="indigo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#6366f1" />
<title>West Bengal: Exam & Mock Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#6366f1;--brand-2:#8b5cf6;--brand-3:#ec4899;--brand-rgb:99,102,241;--success:#10b981;--danger:#ef4444;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:rgba(148,163,184,.15);--radius:20px;--shadow:0 4px 24px -8px rgba(15,23,42,.08);--header-bg:rgba(255,255,255,.92)}
[data-color="indigo"]{--brand:#6366f1;--brand-2:#8b5cf6;--brand-3:#ec4899;--brand-rgb:99,102,241}
[data-color="emerald"]{--brand:#10b981;--brand-2:#059669;--brand-3:#0d9488;--brand-rgb:16,185,129}
[data-color="rose"]{--brand:#ec4899;--brand-2:#db2777;--brand-3:#f43f5e;--brand-rgb:236,72,153}
[data-color="amber"]{--brand:#f59e0b;--brand-2:#f97316;--brand-3:#eab308;--brand-rgb:245,158,11}
[data-color="cyan"]{--brand:#06b6d4;--brand-2:#0891b2;--brand-3:#3b82f6;--brand-rgb:6,182,212}
[data-color="violet"]{--brand:#8b5cf6;--brand-2:#7c3aed;--brand-3:#a855f7;--brand-rgb:139,92,246}
[data-color="slate"]{--brand:#64748b;--brand-2:#475569;--brand-3:#334155;--brand-rgb:100,116,139}
[data-theme="dark"]{--bg:#0b1220;--card:#131c31;--text:#e2e8f0;--muted:#94a3b8;--border:rgba(100,116,139,.25);--header-bg:rgba(19,28,49,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:'Hind Siliguri','Inter',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:16px;padding-bottom:100px}
.screen::-webkit-scrollbar{display:none}
h1{font-size:24px;font-weight:800;margin:0}
h2{font-size:20px;font-weight:700;margin:0 0 12px}
h3{font-size:16px;font-weight:700;margin:0 0 8px}
p{margin:0;line-height:1.5}
.muted{color:var(--muted);font-size:13px}
.header{display:flex;align-items:center;justify-content:space-between;background:var(--header-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;padding:10px 14px}
.header-left{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.header-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-3));display:grid;place-items:center;color:white;font-size:12px;font-weight:900;flex-shrink:0;box-shadow:0 4px 14px rgba(var(--brand-rgb),.35)}
.header-info{min-width:0;flex:1}
.header-title{font-size:14px;line-height:1.1;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;gap:5px;align-items:center;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(148,163,184,.15);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:transform .15s;position:relative;color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.theme-btn{background:linear-gradient(135deg,rgba(var(--brand-rgb),.15),rgba(var(--brand-rgb),.08))}
.theme-dot{position:absolute;bottom:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:1.5px solid var(--card)}
.premium-greeting{text-align:center;padding:14px 0 22px;animation:slideDown .6s cubic-bezier(.16,1,.3,1)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.welcome-back{font-size:34px;font-weight:900;letter-spacing:-1.2px;line-height:1.05;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 40%,var(--brand-3) 80%,var(--brand) 100%);background-size:250% 250%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmerText 4s ease-in-out infinite}
@keyframes shimmerText{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.welcome-sub{margin-top:12px;font-size:13px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.welcome-quote{margin-top:12px;font-size:12px;color:var(--muted);font-style:italic;display:inline-block;padding:7px 18px;background:rgba(var(--brand-rgb),.07);border-radius:99px;max-width:92%;line-height:1.5}
.streak-chip{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,#f59e0b,#ec4899);color:white;font-size:11px;font-weight:900;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.5}
.search-input{width:100%;padding:14px 16px 14px 46px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-family:inherit;box-shadow:0 4px 16px -6px rgba(15,23,42,.08)}
.search-input:focus{outline:none;border-color:var(--brand)}
.dual-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-hero{border-radius:20px;padding:16px 12px;color:white;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s;box-shadow:0 10px 28px -10px rgba(0,0,0,.3);min-height:172px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:space-between}
.mini-hero:active{transform:scale(.96)}
.mini-hero::before{content:'';position:absolute;top:-40%;right:-30%;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2);pointer-events:none}
.mini-hero>*{position:relative;z-index:1}
.mini-label{font-size:9px;font-weight:800;letter-spacing:.7px;opacity:.92}
.mini-icon{font-size:34px;margin:6px 0}
.mini-title{font-size:14px;font-weight:900;line-height:1.2}
.mini-meta{font-size:10px;opacity:.9;margin-top:4px;font-weight:600}
.mini-cta{margin-top:8px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.28);font-size:10px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-box{background:var(--card);border-radius:16px;padding:14px 6px 12px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,#6366f1)}
.stat-icon{font-size:20px}
.stat-value{font-size:18px;font-weight:900;margin-top:5px;letter-spacing:-.5px}
.stat-label{font-size:9px;color:var(--muted);font-weight:700;margin-top:2px}
.sec-head-compact{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
.sec-head-compact h3{margin:0;font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px}
.sec-head-compact .action{font-size:11px;color:var(--brand);font-weight:800;background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-family:inherit}
.quick-action{padding:14px 6px;border-radius:16px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-family:inherit;color:var(--text);box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.quick-action:active{transform:scale(.95)}
.quick-action::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-color,rgba(var(--brand-rgb),.1)),transparent 60%);pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 16px;border-radius:99px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px -4px rgba(15,23,42,.1);font-family:inherit;color:var(--text)}
.exam-card-centered{background:var(--grad);border-radius:20px;padding:18px 12px;color:white;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;text-align:center;min-height:150px;justify-content:space-between;position:relative;overflow:hidden}
.exam-card-centered:active{transform:scale(.96)}
.exam-card-centered::before{content:'';position:absolute;top:-40%;right:-30%;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.15);pointer-events:none}
.exam-card-centered>*{position:relative;z-index:1}
.exam-tag{position:absolute;top:10px;right:10px;font-size:8px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.25);font-weight:800;z-index:2}
.exam-icon{font-size:28px}
.exam-title{font-size:13px;font-weight:900;margin-top:8px;line-height:1.2}
.exam-desc{font-size:10px;opacity:.9;margin-top:3px}
.exam-footer{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.2);font-size:10px;font-weight:700}
.content-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.content-card{background:var(--card);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100px}
.content-card:active{transform:scale(.95)}
.content-card .icon{font-size:28px;margin-bottom:6px}
.content-card .name{font-size:11px;font-weight:800;line-height:1.2;margin-bottom:3px}
.content-card .count{font-size:9px;color:var(--muted);font-weight:700}
.content-card .badge{position:absolute;top:6px;right:6px;font-size:8px;padding:1px 5px;border-radius:6px;background:rgba(var(--brand-rgb),.15);color:var(--brand);font-weight:800}
.job-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.job-card:active{transform:scale(.98)}
.job-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--job-color,var(--brand))}
.job-header{display:flex;align-items:center;gap:10px}
.job-icon{width:44px;height:44px;border-radius:12px;background:var(--job-color,var(--brand));display:grid;place-items:center;font-size:20px;flex-shrink:0;color:white}
.job-body{flex:1;min-width:0}
.job-title{font-weight:800;font-size:13px;line-height:1.3}
.job-org{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
.job-deadline{font-size:10px;font-weight:900;padding:4px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.job-desc{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.job-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:700}
.job-type-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:8px;background:rgba(var(--brand-rgb),.1);color:var(--brand);font-weight:800}
.activity{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin-bottom:8px}
.activity-icon{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:16px}
.activity-body{flex:1;min-width:0}
.activity-title{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-meta{font-size:10px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.btn{border:none;border-radius:14px;padding:14px 20px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:white;box-shadow:0 4px 16px rgba(var(--brand-rgb),.35)}
.btn-success{background:var(--success);color:white}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 50%,var(--brand-3) 100%);border-radius:24px;padding:24px;color:white;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-20%;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.15)}
.hero-content{position:relative;z-index:1}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:50;max-width:480px;margin:0 auto;box-shadow:0 -4px 20px -8px rgba(15,23,42,.1)}
.nav button{background:none;border:none;font-size:9px;font-weight:700;color:var(--muted);padding:8px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;position:relative}
.nav button .icon{font-size:19px}
.nav button.active{color:var(--brand);background:rgba(var(--brand-rgb),.1)}
.nav button .nav-badge{position:absolute;top:2px;right:8px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--danger);color:white;font-size:8px;font-weight:900;display:grid;place-items:center;border:1.5px solid var(--card)}
.skel{background:linear-gradient(90deg,rgba(148,163,184,.1) 25%,rgba(148,163,184,.2) 50%,rgba(148,163,184,.1) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);background:#0f172a;color:white;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
textarea{resize:vertical;min-height:80px}
.option{width:100%;text-align:left;padding:14px 18px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;font-family:inherit}
.option:active{transform:scale(.99)}
.option.correct{background:rgba(16,185,129,.15);border-color:var(--success);color:var(--success)}
.option.wrong{background:rgba(239,68,68,.15);border-color:var(--danger);color:var(--danger)}
.option.selected{background:rgba(var(--brand-rgb),.1);border-color:var(--brand)}
.progress-track{width:100%;height:8px;border-radius:4px;background:rgba(148,163,184,.2);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand),var(--brand-3));transition:width .4s}
.bookmark-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px}
.timer-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(239,68,68,.12);color:var(--danger);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
@keyframes confettiFall{to{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
.confetti-piece{position:fixed;pointer-events:none;z-index:99999;animation:confettiFall 1.5s ease-out forwards}
.empty-state{text-align:center;padding:32px 20px;background:var(--card);border-radius:20px;border:1px dashed var(--border)}
.empty-state .emoji{font-size:42px}
.empty-state .title{font-weight:800;margin-top:10px;font-size:15px}
.empty-state .sub{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--muted);opacity:.4;margin:-8px auto 16px}
.theme-section{margin-bottom:18px}
.theme-section-title{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.8px;margin:0 0 10px 4px;text-transform:uppercase}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.theme-swatch{aspect-ratio:1;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:3px solid transparent;padding:10px 6px}
.theme-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.theme-swatch .swatch-circle{width:34px;height:34px;border-radius:50%}
.theme-swatch .swatch-name{font-size:9px;font-weight:800;color:var(--text);text-align:center;line-height:1.1}
.mode-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;cursor:pointer}
.mode-toggle-row .label{font-size:14px;font-weight:800;display:flex;align-items:center;gap:10px}
.mode-toggle-row .toggle{width:52px;height:30px;border-radius:99px;background:rgba(148,163,184,.3);position:relative;flex-shrink:0}
.mode-toggle-row .toggle.on{background:var(--brand)}
.mode-toggle-row .toggle::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:white;transition:transform .2s}
.mode-toggle-row .toggle.on::after{transform:translateX(22px)}
.settings-section{margin-bottom:22px}
.settings-section-title{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.8px;margin:0 0 8px 4px;text-transform:uppercase}
.settings-card{background:var(--card);border-radius:16px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border);font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;color:var(--text);font-size:14px}
.settings-row:last-child{border-bottom:none}
.settings-row-left{display:flex;align-items:center;gap:12px;font-weight:600}
.settings-row-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}

<style>
:root{--brand:#6366f1;--brand-2:#8b5cf6;--brand-3:#ec4899;--brand-rgb:99,102,241;--success:#10b981;--danger:#ef4444;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:rgba(148,163,184,.15);--radius:20px;--shadow:0 4px 24px -8px rgba(15,23,42,.08);--header-bg:rgba(255,255,255,.92)}
[data-color="indigo"]{--brand:#6366f1;--brand-2:#8b5cf6;--brand-3:#ec4899;--brand-rgb:99,102,241}
[data-color="emerald"]{--brand:#10b981;--brand-2:#059669;--brand-3:#0d9488;--brand-rgb:16,185,129}
[data-color="rose"]{--brand:#ec4899;--brand-2:#db2777;--brand-3:#f43f5e;--brand-rgb:236,72,153}
[data-color="amber"]{--brand:#f59e0b;--brand-2:#f97316;--brand-3:#eab308;--brand-rgb:245,158,11}
[data-color="cyan"]{--brand:#06b6d4;--brand-2:#0891b2;--brand-3:#3b82f6;--brand-rgb:6,182,212}
[data-color="violet"]{--brand:#8b5cf6;--brand-2:#7c3aed;--brand-3:#a855f7;--brand-rgb:139,92,246}
[data-color="slate"]{--brand:#64748b;--brand-2:#475569;--brand-3:#334155;--brand-rgb:100,116,139}
[data-theme="dark"]{--bg:#0b1220;--card:#131c31;--text:#e2e8f0;--muted:#94a3b8;--border:rgba(100,116,139,.25);--header-bg:rgba(19,28,49,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:'Hind Siliguri','Inter',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:16px;padding-bottom:100px}
.screen::-webkit-scrollbar{display:none}
h1{font-size:24px;font-weight:800;margin:0}
h2{font-size:20px;font-weight:700;margin:0 0 12px}
h3{font-size:16px;font-weight:700;margin:0 0 8px}
p{margin:0;line-height:1.5}
.muted{color:var(--muted);font-size:13px}
.header{display:flex;align-items:center;justify-content:space-between;background:var(--header-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;padding:10px 14px}
.header-left{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.header-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-3));display:grid;place-items:center;color:white;font-size:12px;font-weight:900;flex-shrink:0;box-shadow:0 4px 14px rgba(var(--brand-rgb),.35)}
.header-info{min-width:0;flex:1}
.header-title{font-size:14px;line-height:1.1;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;gap:5px;align-items:center;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(148,163,184,.15);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:transform .15s;position:relative;color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.theme-btn{background:linear-gradient(135deg,rgba(var(--brand-rgb),.15),rgba(var(--brand-rgb),.08))}
.theme-dot{position:absolute;bottom:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:1.5px solid var(--card)}
.premium-greeting{text-align:center;padding:14px 0 22px;animation:slideDown .6s cubic-bezier(.16,1,.3,1)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.welcome-back{font-size:34px;font-weight:900;letter-spacing:-1.2px;line-height:1.05;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 40%,var(--brand-3) 80%,var(--brand) 100%);background-size:250% 250%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmerText 4s ease-in-out infinite}
@keyframes shimmerText{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.welcome-sub{margin-top:12px;font-size:13px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.welcome-quote{margin-top:12px;font-size:12px;color:var(--muted);font-style:italic;display:inline-block;padding:7px 18px;background:rgba(var(--brand-rgb),.07);border-radius:99px;max-width:92%;line-height:1.5}
.streak-chip{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,#f59e0b,#ec4899);color:white;font-size:11px;font-weight:900;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.5}
.search-input{width:100%;padding:14px 16px 14px 46px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-family:inherit;box-shadow:0 4px 16px -6px rgba(15,23,42,.08)}
.search-input:focus{outline:none;border-color:var(--brand)}
.dual-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-hero{border-radius:20px;padding:16px 12px;color:white;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s;box-shadow:0 10px 28px -10px rgba(0,0,0,.3);min-height:172px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:space-between}
.mini-hero:active{transform:scale(.96)}
.mini-hero::before{content:'';position:absolute;top:-40%;right:-30%;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2);pointer-events:none}
.mini-hero>*{position:relative;z-index:1}
.mini-label{font-size:9px;font-weight:800;letter-spacing:.7px;opacity:.92}
.mini-icon{font-size:34px;margin:6px 0}
.mini-title{font-size:14px;font-weight:900;line-height:1.2}
.mini-meta{font-size:10px;opacity:.9;margin-top:4px;font-weight:600}
.mini-cta{margin-top:8px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.28);font-size:10px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-box{background:var(--card);border-radius:16px;padding:14px 6px 12px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,#6366f1)}
.stat-icon{font-size:20px}
.stat-value{font-size:18px;font-weight:900;margin-top:5px;letter-spacing:-.5px}
.stat-label{font-size:9px;color:var(--muted);font-weight:700;margin-top:2px}
.sec-head-compact{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
.sec-head-compact h3{margin:0;font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px}
.sec-head-compact .action{font-size:11px;color:var(--brand);font-weight:800;background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-family:inherit}
.quick-action{padding:14px 6px;border-radius:16px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-family:inherit;color:var(--text);box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.quick-action:active{transform:scale(.95)}
.quick-action::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-color,rgba(var(--brand-rgb),.1)),transparent 60%);pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 16px;border-radius:99px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px -4px rgba(15,23,42,.1);font-family:inherit;color:var(--text)}
.exam-card-centered{background:var(--grad);border-radius:20px;padding:18px 12px;color:white;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;text-align:center;min-height:150px;justify-content:space-between;position:relative;overflow:hidden}
.exam-card-centered:active{transform:scale(.96)}
.exam-card-centered::before{content:'';position:absolute;top:-40%;right:-30%;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.15);pointer-events:none}
.exam-card-centered>*{position:relative;z-index:1}
.exam-tag{position:absolute;top:10px;right:10px;font-size:8px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.25);font-weight:800;z-index:2}
.exam-icon{font-size:28px}
.exam-title{font-size:13px;font-weight:900;margin-top:8px;line-height:1.2}
.exam-desc{font-size:10px;opacity:.9;margin-top:3px}
.exam-footer{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.2);font-size:10px;font-weight:700}
.content-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.content-card{background:var(--card);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100px}
.content-card:active{transform:scale(.95)}
.content-card .icon{font-size:28px;margin-bottom:6px}
.content-card .name{font-size:11px;font-weight:800;line-height:1.2;margin-bottom:3px}
.content-card .count{font-size:9px;color:var(--muted);font-weight:700}
.content-card .badge{position:absolute;top:6px;right:6px;font-size:8px;padding:1px 5px;border-radius:6px;background:rgba(var(--brand-rgb),.15);color:var(--brand);font-weight:800}
.job-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.job-card:active{transform:scale(.98)}
.job-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--job-color,var(--brand))}
.job-header{display:flex;align-items:center;gap:10px}
.job-icon{width:44px;height:44px;border-radius:12px;background:var(--job-color,var(--brand));display:grid;place-items:center;font-size:20px;flex-shrink:0;color:white}
.job-body{flex:1;min-width:0}
.job-title{font-weight:800;font-size:13px;line-height:1.3}
.job-org{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
.job-deadline{font-size:10px;font-weight:900;padding:4px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.job-desc{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.job-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:700}
.job-type-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:8px;background:rgba(var(--brand-rgb),.1);color:var(--brand);font-weight:800}
.activity{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin-bottom:8px}
.activity-icon{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:16px}
.activity-body{flex:1;min-width:0}
.activity-title{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-meta{font-size:10px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.btn{border:none;border-radius:14px;padding:14px 20px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:white;box-shadow:0 4px 16px rgba(var(--brand-rgb),.35)}
.btn-success{background:var(--success);color:white}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 50%,var(--brand-3) 100%);border-radius:24px;padding:24px;color:white;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-20%;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.15)}
.hero-content{position:relative;z-index:1}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:50;max-width:480px;margin:0 auto;box-shadow:0 -4px 20px -8px rgba(15,23,42,.1)}
.nav button{background:none;border:none;font-size:9px;font-weight:700;color:var(--muted);padding:8px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;position:relative}
.nav button .icon{font-size:19px}
.nav button.active{color:var(--brand);background:rgba(var(--brand-rgb),.1)}
.nav button .nav-badge{position:absolute;top:2px;right:8px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--danger);color:white;font-size:8px;font-weight:900;display:grid;place-items:center;border:1.5px solid var(--card)}
.skel{background:linear-gradient(90deg,rgba(148,163,184,.1) 25%,rgba(148,163,184,.2) 50%,rgba(148,163,184,.1) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);background:#0f172a;color:white;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
textarea{resize:vertical;min-height:80px}
.option{width:100%;text-align:left;padding:14px 18px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;font-family:inherit}
.option:active{transform:scale(.99)}
.option.correct{background:rgba(16,185,129,.15);border-color:var(--success);color:var(--success)}
.option.wrong{background:rgba(239,68,68,.15);border-color:var(--danger);color:var(--danger)}
.option.selected{background:rgba(var(--brand-rgb),.1);border-color:var(--brand)}
.progress-track{width:100%;height:8px;border-radius:4px;background:rgba(148,163,184,.2);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand),var(--brand-3));transition:width .4s}
.bookmark-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px}
.timer-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(239,68,68,.12);color:var(--danger);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
@keyframes confettiFall{to{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
.confetti-piece{position:fixed;pointer-events:none;z-index:99999;animation:confettiFall 1.5s ease-out forwards}
.empty-state{text-align:center;padding:32px 20px;background:var(--card);border-radius:20px;border:1px dashed var(--border)}
.empty-state .emoji{font-size:42px}
.empty-state .title{font-weight:800;margin-top:10px;font-size:15px}
.empty-state .sub{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--muted);opacity:.4;margin:-8px auto 16px}
.theme-section{margin-bottom:18px}
.theme-section-title{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.8px;margin:0 0 10px 4px;text-transform:uppercase}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.theme-swatch{aspect-ratio:1;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:3px solid transparent;padding:10px 6px}
.theme-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.theme-swatch .swatch-circle{width:34px;height:34px;border-radius:50%}
.theme-swatch .swatch-name{font-size:9px;font-weight:800;color:var(--text);text-align:center;line-height:1.1}
.mode-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;cursor:pointer}
.mode-toggle-row .label{font-size:14px;font-weight:800;display:flex;align-items:center;gap:10px}
.mode-toggle-row .toggle{width:52px;height:30px;border-radius:99px;background:rgba(148,163,184,.3);position:relative;flex-shrink:0}
.mode-toggle-row .toggle.on{background:var(--brand)}
.mode-toggle-row .toggle::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:white;transition:transform .2s}
.mode-toggle-row .toggle.on::after{transform:translateX(22px)}
.settings-section{margin-bottom:22px}
.settings-section-title{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.8px;margin:0 0 8px 4px;text-transform:uppercase}
.settings-card{background:var(--card);border-radius:16px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border);font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;color:var(--text);font-size:14px}
.settings-row:last-child{border-bottom:none}
.settings-row-left{display:flex;align-items:center;gap:12px;font-weight:600}
.settings-row-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.settings-row-right{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.settings-profile{background:linear-gradient(135deg,var(--brand),var(--brand-2),var(--brand-3));border-radius:20px;padding:20px;color:white;margin-bottom:22px;display:flex;align-items:center;gap:14px}
.settings-profile-avatar{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.settings-profile-name{font-size:16px;font-weight:900}
.settings-profile-meta{font-size:11px;opacity:.9;margin-top:3px}
.settings-version{text-align:center;padding:24px 0 8px;color:var(--muted);font-size:11px;line-height:1.6}
.lb-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;margin-bottom:8px;background:var(--card);border:1px solid var(--border)}
.lb-item.me{background:linear-gradient(135deg,rgba(var(--brand-rgb),.1),rgba(236,72,153,.1));border-color:var(--brand);border-width:2px}
.lb-rank{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:900;font-size:13px}
.rank-1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f}
.rank-2{background:linear-gradient(135deg,#d1d5db,#9ca3af);color:#374151}
.rank-3{background:linear-gradient(135deg,#f97316,#ea580c);color:white}
.rank-default{background:rgba(148,163,184,.15);color:var(--muted)}

/* ========== INDEXEDDB ========== */
const DB_NAME='EduPrepDB',DB_VERSION=6;let _db=null;
function openDB(){if(_db)return Promise.resolve(_db);return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const db=e.target.result;['mcqs','exams','contents','submissions','categories','bookmarks','leaderboard','notifications','dailyChallenges','challengeCompletions','jobNotifications'].forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:'id'})});if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
async function getAll(s){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(s,'readonly'),r=tx.objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putAll(s,items){if(!items?.length)return;const db=await openDB();const tx=db.transaction(s,'readwrite'),st=tx.objectStore(s);items.forEach(i=>st.put(i));return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function deleteFrom(s,id){const db=await openDB();const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(id);return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function clearAll(s){const db=await openDB();const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function setMeta(k,v){const db=await openDB();const tx=db.transaction('meta','readwrite');tx.objectStore('meta').put({key:k,value:v});return new Promise(r=>{tx.oncomplete=r})}
async function getMeta(k){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('meta','readonly'),r=tx.objectStore('meta').get(k);r.onsuccess=()=>res(r.result?.value);r.onerror=()=>rej(r.error)})}
async function seedCategories(){const items=[...DEFAULT_EXAMS];DEFAULT_EXAMS.forEach(exam=>{const subs=DEFAULT_EXAM_SUBJECTS[exam.id]||['বাংলা','ইংরেজি','গণিত'];subs.forEach((name,i)=>{items.push({id:`sub_${exam.id}_${i}`,type:'subject',examId:exam.id,name,icon:SUBJECT_ICONS[name]||'📖',order:i})})});await putAll('categories',items)}
async function migrateCategories(cats){const hasOld=cats.some(c=>c.type==='subject'&&!c.examId);if(!hasOld)return cats;const oldExams=cats.filter(c=>c.type==='exam'),examsToUse=oldExams.length?oldExams:DEFAULT_EXAMS;await clearAll('categories');const items=[...examsToUse];examsToUse.forEach(exam=>{const defaults=DEFAULT_EXAM_SUBJECTS[exam.id]||['বাংলা','ইংরেজি','গণিত','সাধারণ জ্ঞান'];defaults.forEach((name,i)=>{items.push({id:`sub_${exam.id}_${i}`,type:'subject',examId:exam.id,name,icon:SUBJECT_ICONS[name]||'📖',order:i})})});await putAll('categories',items);return items}
async function bulkImport(json){const stores=['mcqs','exams','contents','submissions','categories','bookmarks','leaderboard','notifications','dailyChallenges','challengeCompletions','jobNotifications'];for(const s of stores)await clearAll(s);await putAll('mcqs',json.mcqs||[]);await putAll('exams',json.exams||json.scheduledExams||[]);await putAll('contents',json.contents||[]);await putAll('submissions',json.submissions||[]);await putAll('bookmarks',(json.bookmarks||[]).map(b=>typeof b==='string'?{id:b,savedAt:Date.now()}:b));await putAll('leaderboard',json.leaderboard||[]);await putAll('notifications',json.notifications||[]);await putAll('dailyChallenges',json.dailyChallenges||[]);await putAll('challengeCompletions',json.challengeCompletions||[]);await putAll('jobNotifications',json.jobNotifications||[]);if(json.categories?.length)await putAll('categories',json.categories);else await seedCategories();await setMeta('updatedAt',Date.now())}
async function exportSnapshot(){return{version:7,updatedAt:Date.now(),mcqs:await getAll('mcqs'),scheduledExams:await getAll('exams'),contents:await getAll('contents'),submissions:await getAll('submissions'),categories:await getAll('categories'),bookmarks:await getAll('bookmarks'),leaderboard:await getAll('leaderboard'),notifications:await getAll('notifications'),dailyChallenges:await getAll('dailyChallenges'),challengeCompletions:await getAll('challengeCompletions'),jobNotifications:await getAll('jobNotifications')}}

/* ========== STATE ========== */
let state={mcqs:[],exams:[],contents:[],submissions:[],bookmarks:[],leaderboard:[],notifications:[],dailyChallenges:[],challengeCompletions:[],jobNotifications:[],examTypes:[],subjectList:[],ui:{screen:'welcome',examId:'wb_tet',subject:'',fontSize:14,darkMode:false,colorTheme:'indigo',quizIndex:0,selectedOpt:null,quizScore:0,loading:true,searchQuery:'',lastExamId:null,streak:0,quizStartTime:null,leaderboardTab:'all',challengeAnswer:null,challengeSubmitted:false,contentType:null,liveExamId:null,liveIndex:0,liveAnswers:[],liveScore:0,liveSubmitted:false}};

async function hydrate(){
  let cats=await getAll('categories');
  if(!cats.length){await seedCategories();cats=await getAll('categories')}else{cats=await migrateCategories(cats)}
  const[mcqs,exams,contents,submissions,bookmarks,leaderboard,notifications,dailyChallenges,challengeCompletions,jobNotifications,dark,colorTheme,lastExamId]=await Promise.all([getAll('mcqs'),getAll('exams'),getAll('contents'),getAll('submissions'),getAll('bookmarks'),getAll('leaderboard'),getAll('notifications'),getAll('dailyChallenges'),getAll('challengeCompletions'),getAll('jobNotifications'),getMeta('darkMode'),getMeta('colorTheme'),getMeta('lastExamId')]);
  state.mcqs=mcqs;state.exams=exams;state.contents=contents;state.submissions=submissions;state.bookmarks=bookmarks;state.leaderboard=leaderboard;state.notifications=notifications.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));state.dailyChallenges=dailyChallenges;state.challengeCompletions=challengeCompletions;
  state.jobNotifications=jobNotifications.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  state.examTypes=cats.filter(c=>c.type==='exam').sort((a,b)=>(a.order||0)-(b.order||0));
  state.subjectList=cats.filter(c=>c.type==='subject').sort((a,b)=>(a.order||0)-(b.order||0));
  state.ui.darkMode=dark===true;state.ui.colorTheme=colorTheme||'indigo';state.ui.lastExamId=lastExamId||(state.examTypes[0]?.id||'wb_tet');state.ui.loading=false;
  const defSubs=getSubjectsForExam(state.ui.lastExamId);
  if(defSubs.length&&!defSubs.find(s=>s.name===state.ui.subject))state.ui.subject=defSubs[0].name;
  state.ui.streak=await updateStreak();updateUnreadCount();updateJobsBadge();
  applyThemeToDOM();
  renderAll();
}
function applyThemeToDOM(){if(state.ui.darkMode)document.documentElement.dataset.theme='dark';else document.documentElement.removeAttribute('data-theme');document.documentElement.dataset.color=state.ui.colorTheme;const metaTheme=document.querySelector('meta[name="theme-color"]');if(metaTheme){const t=COLOR_THEMES.find(t=>t.id===state.ui.colorTheme);if(t)metaTheme.setAttribute('content',t.color)}const btn=document.getElementById('darkToggleBtn');if(btn)btn.textContent=state.ui.darkMode?'☀️':'🌙'}
function getSubjectsForExam(id){return state.subjectList.filter(s=>s.examId===id)}
async function updateStreak(){const today=new Date().toDateString();let d=await getMeta('streakData')||{count:0,lastDate:null};if(d.lastDate===today)return d.count;const y=new Date(Date.now()-86400000).toDateString();if(d.lastDate===y)d.count++;else d.count=1;d.lastDate=today;await setMeta('streakData',d);return d.count}
function updateUnreadCount(){const u=state.notifications.filter(n=>!n.read).length;const b=document.getElementById('bellBadge');if(b){if(u>0){b.textContent=u>9?'9+':u;b.style.display='grid'}else b.style.display='none'}}
function updateJobsBadge(){const active=state.jobNotifications.filter(j=>{const d=daysUntilDeadline(j.deadline);return !j.deadline||d===null||d>=0}).length;const b=document.getElementById('jobsNavBadge');if(b){if(active>0){b.textContent=active>9?'9+':active;b.style.display='grid'}else b.style.display='none'}}
function daysUntilDeadline(d){if(!d)return null;const now=new Date();now.setHours(0,0,0,0);const dl=new Date(d);dl.setHours(0,0,0,0);return Math.ceil((dl-now)/86400000)}

/* ========== TOAST, CONFETTI, MODAL ========== */
const toastEl=document.getElementById('toast');
function toast(msg,type=''){toastEl.textContent=msg;toastEl.className='toast show '+type;clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.className='toast '+type,2400)}
function confetti(){const colors=['#6366f1','#8b5cf6','#ec4899','#10b981','#f59e0b','#ef4444','#06b6d4'];for(let i=0;i<24;i++){const p=document.createElement('div');const size=6+Math.random()*6;p.className='confetti-piece';p.style.cssText=`left:${50+(Math.random()-.5)*20}%;top:50%;width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'}`;p.style.setProperty('--tx',`${(Math.random()-.5)*320}px`);p.style.setProperty('--ty',`${-180-Math.random()*220}px`);p.style.setProperty('--rot',`${Math.random()*720-360}deg`);document.body.appendChild(p);setTimeout(()=>p.remove(),1600)}}
const modalOverlay=document.getElementById('modalOverlay'),modalSheet=document.getElementById('modalSheet');

/* ========== CLOUD SYNC (dynamic import) ========== */
async function syncFromCloud(showMsg=false){
  try{
    if(showMsg)toast('🔄 সিঙ্ক হচ্ছে...');
    const {pullContent}=await import('./firebase-sync.js');
    const remote=await pullContent();
    if(!remote){if(showMsg)toast('❌ ক্লাউডে কিছু নেই','error');return}
    const lastSync=await getMeta('lastSyncAt')||0;
    if((remote.updatedAt||0)>lastSync){
      await bulkImport(remote);await setMeta('lastSyncAt',remote.updatedAt);await hydrate();
      toast('✅ নতুন কনটেন্ট আপডেট হয়েছে','success');
    }else if(showMsg){toast('✅ কনটেন্ট আপ-টু-ডেট','success')}
  }catch(e){console.log('Sync failed:',e);if(showMsg)toast('❌ ইন্টারনেট চেক করুন','error')}
}

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getGreeting(){const h=new Date().getHours();if(h<5)return'শুভ রাত্রি';if(h<12)return'শুভ সকাল';if(h<17)return'শুভ অপরাহ্ন';if(h<21)return'শুভ সন্ধ্যা';return'শুভ রাত্রি'}
function getQuote(){return QUOTES[new Date().getDate()%QUOTES.length]}
function normalizeStr(s){return String(s||'').trim().toLowerCase()}
function getExamContents(examId,subject){const n=normalizeStr(subject);return state.contents.filter(c=>c.examId===examId&&normalizeStr(c.subject)===n)}
function getExamMcqs(examId,subject){const n=normalizeStr(subject);return state.mcqs.filter(m=>m.examId===examId&&normalizeStr(m.subject)===n)}
function filterByType(items,type){const n=normalizeStr(type);return items.filter(c=>normalizeStr(c.type)===n)}
function getTodayDate(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getTimeToMidnight(){const now=new Date(),m=new Date(now);m.setHours(24,0,0,0);return m-now}
function getTodaysChallenge(){const today=getTodayDate();let c=state.dailyChallenges.find(x=>x.date===today);if(c){const mcq=state.mcqs.find(m=>m.id===c.mcqId);if(mcq)return{...c,mcq}}if(state.mcqs.length){const dayOfYear=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);const mcq=state.mcqs[dayOfYear%state.mcqs.length];return{id:'auto_'+today,date:today,mcqId:mcq.id,bonus:50,mcq,isAuto:true}}return null}
function isChallengeCompleted(){const t=getTodayDate();return state.challengeCompletions.some(c=>c.date===t)}
function getChallengeStreak(){const dates=new Set(state.challengeCompletions.map(c=>c.date));let s=0;const d=new Date();while(true){const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(dates.has(k)){s++;d.setDate(d.getDate()-1)}else break}return s}
async function submitChallengeAnswer(idx){if(state.ui.challengeSubmitted)return;const c=getTodaysChallenge();if(!c)return;state.ui.challengeAnswer=idx;state.ui.challengeSubmitted=true;if(idx===c.mcq.correctIndex){confetti();await putAll('challengeCompletions',[{id:'cc_'+Date.now(),date:getTodayDate(),mcqId:c.mcqId,completedAt:Date.now(),bonus:c.bonus}]);state.challengeCompletions=await getAll('challengeCompletions');toast(`🎉 সঠিক! +${c.bonus} বোনাস`,'success')}else toast('❌ ভুল উত্তর','error');renderStudent()}
function getLeaderboardData(tab='all'){let e=[...state.leaderboard];if(tab==='weekly'){const w=Date.now()-7*86400000;e=e.filter(x=>(x.timestamp||0)>=w)}if(tab==='my'){const m=e.filter(x=>x.isMe);if(m.length===0&&(state.ui.quizScore>0||state.submissions.length>0)){const s=Math.min(100,Math.round(state.ui.quizScore*10+state.submissions.length*5));m.push({id:'me',name:'আমি',score:s,exam:'সব পরীক্ষা',isMe:true,timestamp:Date.now()})}e=m}return e.sort((a,b)=>(b.score||0)-(a.score||0))}
